name: Fork build

# Builds the image Tim's Unraid server runs and publishes it to
# ghcr.io/squeaks72/romarrng.
#
# Much smaller than upstream's docker.yml: one architecture (linux/amd64, the
# only one the server pulls), no browser variant, no release tags. The suite
# still gates the image, and the built image is booted and questioned before it
# is pushed, as upstream does.
#
# `:latest` is what the Unraid container tracks (CA Auto Update pulls it at
# 04:00 local). Every build also gets an immutable `v<upstream>-tim.<sha>` tag
# to pin the container to if a build turns out bad.

on:
  push:
    branches: [tim]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-build
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/squeaks72/romarrng

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: tim
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          python -m pytest tests/ -q

  build:
    needs: test
    name: image / linux-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: tim
          fetch-depth: 0

      - name: Work out the tags
        id: tags
        run: |
          set -euo pipefail
          # The upstream release this fork sits on: upstream's newest tag.
          git fetch --quiet --tags https://github.com/BlizzHacker/romarr.git main || true
          version=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
          sha=$(git rev-parse --short HEAD)
          echo "immutable=${version}-tim.${sha}" >> "$GITHUB_OUTPUT"
          echo "app_version=${version#v}+tim.${sha}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Building::${IMAGE}:latest and :${version}-tim.${sha}"

      - uses: docker/setup-buildx-action@v3

      - name: Build for a smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: romarr:smoke
          build-args: |
            ROMARR_VERSION=${{ steps.tags.outputs.app_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Boot the image and ask it whether it is alive
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/c" "$RUNNER_TEMP/r" "$RUNNER_TEMP/d"
          docker run -d --name smoke -p 6868:6868 -e PUID=1000 -e PGID=1000 -e UMASK=002 \
            -v "$RUNNER_TEMP/c:/config" -v "$RUNNER_TEMP/r:/roms" -v "$RUNNER_TEMP/d:/downloads" \
            romarr:smoke
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:6868/api/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:6868/api/health
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:6868/api/v1/system/status)
          test "$code" = "401" || { echo "status answered $code, not 401"; exit 1; }
          docker exec smoke sh -c 'command -v bsdtar >/dev/null' || { echo "bsdtar missing"; exit 1; }
          docker exec smoke python -c "import requests, rom_hub" || { echo "a dependency did not install"; exit 1; }
          docker logs smoke 2>&1 | grep -q "starting as 1000:1000 with umask 002" \
            || { echo "entrypoint did not drop to PUID:PGID"; exit 1; }
          docker rm -f smoke

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tags.outputs.immutable }}
          build-args: |
            ROMARR_VERSION=${{ steps.tags.outputs.app_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          labels: |
            org.opencontainers.image.title=ROMarr (Squeaks72 fork)
            org.opencontainers.image.description=Personal fork of ROMarr, tracking upstream with local features
            org.opencontainers.image.source=https://github.com/Squeaks72/romarrng
            org.opencontainers.image.version=${{ steps.tags.outputs.immutable }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Say what to pull
        run: |
          {
            echo "### Image published"
            echo
            echo '- `${{ env.IMAGE }}:latest`'
            echo '- `${{ env.IMAGE }}:${{ steps.tags.outputs.immutable }}` (pin here to roll back)'
          } >> "$GITHUB_STEP_SUMMARY"
